name: Pi Monitor
on:
  push:
    paths:
      - solar_monitor_v2.py
      - tests/**
      - .github/workflows/pi-monitor.yml
  pull_request:
    paths:
      - solar_monitor_v2.py
      - tests/**
      - .github/workflows/pi-monitor.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install bleak paho-mqtt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile solar_monitor_v2.py
